name: Veille Reseaux

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run script
        run: python script_social.py
        env:
          WEBHOOK_SOCIAL: ${{ secrets.WEBHOOK_SOCIAL }}

      - name: Commit seen_social.json
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add seen_social.json
          git commit -m "update social seen" || echo "No changes"
          git push
