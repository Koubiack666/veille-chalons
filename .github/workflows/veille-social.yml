name: Veille Sociale - 4x par jour

on:
  schedule:
    # Toutes les 6 heures = 4x par jour
    # 06:00, 12:00, 18:00, 00:00 UTC
    # = 07:00, 13:00, 19:00, 01:00 CET (heure de Paris)
    - cron: '0 0,6,12,18 * * *'
  
  # Permet de lancer manuellement
  workflow_dispatch:

jobs:
  veille-sociale:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Cloner le repository
        uses: actions/checkout@v4
      
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Installer les dépendances
        run: |
    python -m pip install --upgrade pip setuptools wheel
    pip install -r requirements.txt
      
      - name: 🔍 Exécuter la veille sociale
        env:
          WEBHOOK_SOCIAL: ${{ secrets.WEBHOOK_SOCIAL }}
        run: python script_social.py
      
      - name: 💾 Commiter les mises à jour du fichier seen_social.json
        run: |
          git config user.name "Veille Bot"
          git config user.email "bot@veille-chalons.local"
          git add seen_social.json
          if git diff-index --quiet HEAD --; then
            echo "❌ Aucun changement à commiter"
          else
            git commit -m "🤖 Mise à jour veille sociale - $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
      
      - name: ⚠️ Afficher les logs en cas d'erreur
        if: failure()
        run: echo "La veille a rencontré une erreur. Vérifier les logs ci-dessus."
