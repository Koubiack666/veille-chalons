name: 📱 Veille Sociale - 4x par jour

on:
  schedule:
    # Exécution toutes les 6 heures = 4x par jour
    # Times en UTC :
    # - 0:00 UTC  = 01:00 CET (minuit de Paris)
    # - 6:00 UTC  = 07:00 CET (matin)
    # - 12:00 UTC = 13:00 CET (après-midi)
    # - 18:00 UTC = 19:00 CET (soir)
    - cron: '0 0,6,12,18 * * *'
  
  # Permet de lancer manuellement
  workflow_dispatch:

jobs:
  veille-sociale:
    runs-on: ubuntu-latest
    name: 🔍 Veille Réseaux Sociaux
    
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Configuration Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      
      - name: 🔍 Exécuter la veille
        env:
          WEBHOOK_SOCIAL: ${{ secrets.WEBHOOK_SOCIAL }}
        run: |
          echo "📊 Lancement de la veille réseaux sociaux..."
          python script_social.py
          echo "✅ Veille terminée"
      
      - name: 💾 Sauvegarder l'historique
        if: always()
        run: |
          git config user.name "🤖 Veille Bot"
          git config user.email "bot@veille-chalons.local"
          git add -A
          
          if git diff-index --quiet HEAD --; then
            echo "✅ Aucun changement à commiter"
          else
            git commit -m "🤖 Mise à jour veille sociale - $(date '+%d/%m/%Y %H:%M')"
            git push
            echo "✅ Historique mis à jour"
          fi
      
      - name: 📧 Notification en cas d'erreur
        if: failure()
        run: |
          echo "❌ La veille a échoué"
          exit 1
